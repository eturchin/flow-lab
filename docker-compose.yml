name: flowlab
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FlowLab: "Host=db;Port=5432;Database=flowlab;Username=flowlab;Password=${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowlab
      POSTGRES_DB: flowlab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - flowlab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlab -d flowlab"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  flowlab-data:
